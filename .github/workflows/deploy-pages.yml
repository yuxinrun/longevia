name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve site origin and base path
        id: site
        env:
          REPOSITORY: ${{ github.repository }}
          CUSTOM_DOMAIN: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            host=$(printf '%s' "$CUSTOM_DOMAIN" | sed -E 's#^https?://##; s#/+$##; s#/.*$##')
            echo "site_origin=https://${host}" >> "$GITHUB_OUTPUT"
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "cname=${host}" >> "$GITHUB_OUTPUT"
          else
            owner=$(printf '%s' "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
            repo=$(printf '%s' "${REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
            echo "site_origin=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            if [ "$repo" = "${owner}.github.io" ]; then
              echo "base_path=" >> "$GITHUB_OUTPUT"
            else
              echo "base_path=/${repo}" >> "$GITHUB_OUTPUT"
            fi
            echo "cname=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_origin }}
        run: npm run build

      - name: Prepare Pages artifact
        env:
          CNAME_HOST: ${{ steps.site.outputs.cname }}
        run: |
          touch out/.nojekyll
          if [ -n "$CNAME_HOST" ]; then
            printf '%s\n' "$CNAME_HOST" > out/CNAME
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
